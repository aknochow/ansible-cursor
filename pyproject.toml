[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ansible-cursor"
version = "0.1.0"
description = "Ansible collection for the Cursor Agent SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "ansible-core>=2.16.0,<2.19.0",
    "cursor-sdk>=1.0.31,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "ansible-lint>=24.0.0",
    "pytest>=8.0.0,<10.0.0",
    "pytest-cov>=4.0.0,<7.0.0",
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
include = ["plugins*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"plugins/modules/*" = ["E402", "E501"]
