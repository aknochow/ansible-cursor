version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      uv-lock:
        patterns:
          - "*"
        exclude-patterns:
          - "cursor-sdk"
      cursor-sdk:
        patterns:
          - "cursor-sdk"
