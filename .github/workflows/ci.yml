name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  collection-ci:
    uses: aknochow/ansible-plaibook/.github/workflows/collection-ci.yml@main
    with:
      collection_name: cursor
      ansible_lint_paths: meta/runtime.yml galaxy.yml
